name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancela ejecuciones anteriores del mismo ref si llega un push nuevo.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Instalación reproducible desde package-lock.json.
      - name: Install
        run: npm ci

      # El build de Vite no necesita secretos (la API es server-side).
      - name: Build
        run: npm run build

      # Tests de Vitest sobre server/ (fetch mockeado, sin llamadas reales a Notion).
      - name: Test
        run: npm test
